<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visitor Spending in Australia</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/grids-responsive-min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

    <style>
      .page-container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }
      .vega-actions {
        display: none !important;
      }
    </style>
  </head>
  <body
    style="
      font-family: &quot;Times New Roman&quot;, Times, serif;
      background-color: #ffffff;
      margin: 0;
    "
  >
    <div class="page-container">
      <h1>Visitor Spending In Australia</h1>

      <h2>Where Visitors Come From</h2>
      <div class="pure-g">
        <div class="pure-u-1 pure-u-md-1-1" style="margin-bottom: 20px">
          <div
            id="map1"
            style="
              width: 100%;
              min-height: 420px;
              padding: 10px;
              box-sizing: border-box;
            "
          ></div>
        </div>
        <div class="pure-u-1 pure-u-md-1-2">
          <div
            id="idiom1"
            style="
              width: 100%;
              min-height: 420px;
              padding: 10px;
              box-sizing: border-box;
            "
          ></div>
        </div>
        <div class="pure-u-1 pure-u-md-1-2">
          <div
            id="idiom2"
            style="
              width: 100%;
              min-height: 420px;
              padding: 10px;
              box-sizing: border-box;
            "
          ></div>
        </div>
      </div>

      <hr style="margin: 30px 0" />

      <h2>Where the Money Is Spent</h2>
      <div class="pure-g">
        <div class="pure-u-1 pure-u-md-1-2">
          <div
            id="map2"
            style="
              width: 100%;
              min-height: 450px;
              padding: 10px;
              box-sizing: border-box;
            "
          ></div>
        </div>
        <div class="pure-u-1 pure-u-md-1-2">
          <div
            id="map3"
            style="
              width: 100%;
              min-height: 450px;
              padding: 10px;
              box-sizing: border-box;
            "
          ></div>
        </div>
      </div>

      <hr style="margin: 30px 0" />

      <h2>Tourist Spending</h2>
      <div class="pure-g">
        <div class="pure-u-1 pure-u-md-1-2">
          <div
            id="idiom3"
            style="
              width: 100%;
              min-height: 400px;
              padding: 10px;
              box-sizing: border-box;
            "
          ></div>
        </div>
        <div class="pure-u-1 pure-u-md-1-2">
          <div
            id="idiom4"
            style="
              width: 100%;
              min-height: 400px;
              padding: 10px;
              box-sizing: border-box;
            "
          ></div>
        </div>
        <div class="pure-u-1 pure-u-md-1-2" style="margin-top: 20px">
          <div
            id="idiom5"
            style="
              width: 100%;
              min-height: 400px;
              padding: 10px;
              box-sizing: border-box;
            "
          ></div>
        </div>
      </div>
    </div>

    <script>
      const opt = { actions: false };

      vegaEmbed("#map1", "idioms/map1.json", opt).catch(console.error);
      vegaEmbed("#idiom1", "idioms/idiom1.json", opt).catch(console.error);
      vegaEmbed("#idiom2", "idioms/idiom2.json", opt).catch(console.error);

      vegaEmbed("#map2", "idioms/map2.json", opt).catch(console.error);
      vegaEmbed("#map3", "idioms/map3.json", opt).catch(console.error);

      vegaEmbed("#idiom3", "idioms/idiom3.json", opt).catch(console.error);
      vegaEmbed("#idiom4", "idioms/idiom4.json", opt).catch(console.error);
      vegaEmbed("#idiom5", "idioms/idiom5.json", opt).catch(console.error);
    </script>
  </body>
</html>
